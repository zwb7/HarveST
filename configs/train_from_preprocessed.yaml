# HarveST training config using preprocessed matrices.

data:
  sample_id: "151674"
  preprocessed_dir: "./results/preprocessed/151674/<preprocess_run_id>"
  original_data_path: "../Dataset/LIBD/151674"
  count_file: "filtered_feature_bc_matrix.h5"
  adata_file:
  n_top_genes: 3000
  load_ground_truth: true
  truth_file_suffix: "_truth.txt"
  n_clusters: 7

model:
  hidden_2: 256
  hidden_3: 64
  coor_ratio: 0.8

training:
  epochs: 2000
  learning_rate: 0.001
  weight_decay: 0.000001
  g_loss_w: 1.0
  log_interval: 100
  train_seed: 2023

clustering:
  n_clusters: 7
  pca_n_components: 30
  svm_ratio: 0.5
  refine_radius: 50
  cluster_seed: 2020

runtime:
  device: "cuda:7"
  random_seed: 2023
  r_libs_user: "/data1/zhangwenbo/R/library"

output:
  root: "./results/train"
  run_name:
  plot_results: true
  save_results: true
